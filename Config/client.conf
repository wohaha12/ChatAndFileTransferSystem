[Client]
# 客户端配置文件

[Network]
# MetaServer地址
meta_server_host=127.0.0.1
# MetaServer端口
meta_server_port=8000
# 连接超时(秒)
connect_timeout=10
# 读写超时(秒)
io_timeout=30

[Transfer]
# 默认分片大小(字节)
chunk_size=1048576
# 最大并发传输数
max_concurrent_transfers=3
# 传输重试次数
max_retry=3
# 传输超时(秒)
transfer_timeout=300

[UI]
# 界面主题(light/dark)
theme=light
# 自动保存登录信息
auto_save_login=true
# 消息提示音效
sound_enabled=true
# 文件下载路径
download_path=./downloads

[Log]
# 日志级别(DEBUG/INFO/WARNING/ERROR)
level=INFO
# 日志路径
log_path=./logs/client.log
# 最大日志文件大小(MB)
max_log_size=10
# 日志文件备份数量
max_log_files=5
