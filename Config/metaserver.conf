[MetaServer]
# MetaServer配置文件

[Network]
# 监听地址
host=0.0.0.0
# 监听端口
port=8000
# 最大连接数
max_connections=1000

[Database]
# 数据库主机
host=localhost
# 数据库端口
port=3306
# 数据库名称
database=chat_file_transfer
# 数据库用户名
username=root
# 数据库密码
password=
# 连接池大小
pool_size=10
# 连接超时(秒)
timeout=5

[Redis]
# Redis主机
host=localhost
# Redis端口
port=6379
# Redis密码
password=
# 数据库索引
db=0
# 连接超时(秒)
timeout=5

[Storage]
# 默认分片大小(字节)
chunk_size=1048576
# 最大文件大小(字节)
max_file_size=10737418240
# 存储路径
storage_path=./data/storage

[LoadBalancer]
# 负载均衡算法(weighted_round_robin/least_connections)
algorithm=weighted_round_robin
# 心跳超时(秒)
heartbeat_timeout=60
# 最大重试次数
max_retry=3

[Log]
# 日志级别(DEBUG/INFO/WARNING/ERROR)
level=INFO
# 日志路径
log_path=./logs/metaserver.log
# 最大日志文件大小(MB)
max_log_size=10
# 日志文件备份数量
max_log_files=5
