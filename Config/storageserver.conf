[StorageServer]
# StorageServer配置文件

[Network]
# 监听地址
host=0.0.0.0
# 监听端口
port=9001
# 最大连接数
max_connections=1000

[MetaServer]
# MetaServer主机
host=localhost
# MetaServer端口
port=8000
# 心跳间隔(秒)
heartbeat_interval=30

[Storage]
# 存储路径
storage_path=./data/storage
# 临时文件路径
temp_path=./data/temp
# 默认分片大小(字节)
chunk_size=1048576
# 最大文件大小(字节)
max_file_size=10737418240
# 磁盘使用率阈值(%)
disk_usage_threshold=90

[Token]
# Token过期时间(秒)
token_expire_time=3600
# Token续期时间(秒)
token_renew_time=600
# 最大续期次数
max_renew_count=10
# 清理间隔(秒)
cleanup_interval=60

[Log]
# 日志级别(DEBUG/INFO/WARNING/ERROR)
level=INFO
# 日志路径
log_path=./logs/storageserver.log
# 最大日志文件大小(MB)
max_log_size=10
# 日志文件备份数量
max_log_files=5
